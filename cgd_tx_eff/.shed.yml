owner: "pleyte"
remote_repository_url: "https://github.com/ohsu-comp-bio/compbio-galaxy-wrappers/tree/master/cgd_tx_eff"
type: "unrestricted"
categories:
  - "CompBio Galaxy Wrappers"
repositories:
  tfx_cgd:
    description: "Update a VCF with transcript-effects and nomenclature from Annovar and HGVS."
    include:
      - tfx_cgd.xml
      - src/**/*.py
      - test-data/*
      - tool_data_table_conf.xml.sample
      - tool-data/*
  json_to_annovar:
    description: "Convert variants in json file to Annovar avinput"
    include:
      - json_to_annovar.xml
      - src/**/*.py 
      - test-data/test_json2annovar_in.json
  variant_request:
    description: "Create a json message for requesting variants from CGD that need transcript effects"
    include:
      - variant_request.xml      
      - src/**/*.py